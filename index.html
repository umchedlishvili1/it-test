html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans Georgian","Segoe UI",sans-serif;line-height:1.45}
header{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:28px 16px 74px}

.sub{margin:0;opacity:.85;font-size:.92rem}
.main{max-width:760px;margin:-46px auto 0;padding:0 16px 48px}
.sbox{position:relative}
.sbox svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:var(--muted);pointer-events:none}
input[type=search]{width:100%;font:inherit;font-size:1.25rem;color:var(--text);background:var(--card);border:2px solid transparent;border-radius:16px;padding:17px 18px 17px 52px;box-shadow:0 6px 24px rgba(20,30,70,.18)}
input[type=search]:focus{outline:none;border-color:var(--accent)}
.filters{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap;align-items:center}
.seg{display:flex;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:3px}
.seg button{font:inherit;font-size:.88rem;border:0;background:none;color:var(--muted);padding:6px 13px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
select{font:inherit;font-size:.88rem;color:var(--text);background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px 10px;max-width:100%;flex:1;min-width:140px}
.count{color:var(--muted);font-size:.85rem;margin:12px 4px 8px}
.res{display:grid;gap:10px}
.card{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.num{flex:0 0 62px;height:62px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:1.3rem;line-height:1.1}
.num small{font-size:.6rem;font-weight:600;opacity:.9;letter-spacing:.02em;max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.body{flex:1;min-width:0}
.obj{font-size:.93rem;color:var(--muted);word-break:break-word}
.emp{font-size:1.1rem;font-weight:600;margin-top:2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:.78rem;font-weight:600;border-radius:8px;padding:2px 10px}
.tag.bad{background:var(--badbg);color:var(--bad)}
.tag.ok{background:var(--okbg);color:var(--ok)}
.card.closed{opacity:.8}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.call.emp2{background:var(--accent)}
.call{display:inline-flex;align-items:center;gap:8px;background:var(--ok);color:#fff;text-decoration:none;font-weight:600;font-size:.95rem;padding:9px 16px;border-radius:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-size:.9rem;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center}
.toast.show{opacity:1}
.call:active{transform:scale(.97)}
.call small{opacity:.85;font-weight:500;font-size:.8rem}
mark{background:var(--hl);color:inherit;border-radius:4px;padding:0 2px}
.empty{text-align:center;color:var(--muted);padding:36px 0}
.empty b{display:block;font-size:2rem}

   <div class="num" style="background:${i.color}">${esc(i.nShow)}<small>${esc(i.brand)}</small></div>
   <div class="body"><div class="obj">${hl(i.o,q)}</div>
   <div class="emp">${i.closed?'<span class="tag bad">დაიხურა</span>':hl(i.e||'—',q)}</div>
   ${(i.dial||i.phone)?`<div class="btns">${i.dial?`<a class="call" data-num="0322911900,${i.dial}" href="tel:0322911900,${i.dial}">📞 დარეკვა ფილიალში <small>0322911900,${i.dial}</small></a>`:''}${i.phone?`<a class="call emp2" data-num="${i.phone}" href="tel:+995${i.phone}">📞 ${esc(i.e)} <small>${fmt(i.phone)}</small></a>`:''}</div>`:''}</div></div>`).join('');
}
$('res').addEventListener('click',e=>{
  const a=e.target.closest('a.call');if(!a)return;
  const n=a.dataset.num,t=$('toast');
  try{navigator.clipboard.writeText(n)}catch(_){}
  let left=false;const mark=()=>{left=true};
  window.addEventListener('blur',mark,{once:true});
  document.addEventListener('visibilitychange',mark,{once:true});
  setTimeout(()=>{if(!left){t.textContent='თუ დარეკვა არ დაიწყო, ნომერი დაკოპირებულია: '+n;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),6000)}},900);
});
$('q').addEventListener('input',search);
$('emp').addEventListener('change',search);
$('seg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;status=b.dataset.s;[...$('seg').children].forEach(x=>x.classList.toggle('on',x===b));search()});
search();
</script></body></html>
